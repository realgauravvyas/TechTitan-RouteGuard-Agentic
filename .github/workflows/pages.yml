name: Deploy demo to GitHub Pages

# Publishes the browser preview of RouteGuard. Deployment is gated: the Python
# test suite must pass and the browser engine must still reproduce the committed
# Python evidence exactly, so a diverging build can never reach the demo URL.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python test suite
        run: python -m unittest discover -s tests -v

      - name: Regenerate evidence and evaluation
        run: |
          python evaluate.py
          python run_demo.py --scenario double_disruption --output submission/TechTitan_evidence_agentic.json

      - name: Browser engine matches engine.py
        run: node tools/conformance.mjs

      - name: Build site
        run: python tools/build_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
